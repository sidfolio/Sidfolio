# Siddharth (Sid) Srivastava — Product Designer

## About
I'm Sid, a Product Designer with 3+ years of experience on complex, enterprise-scale products. I specialize in end-to-end design, from research to implementation, and collaborate closely with cross-functional teams to deliver user-centered solutions. I'm passionate about building products and interfaces that make human-AI collaboration more intuitive and trustworthy.

Based in New York, NY.

## Education
- M.S. Integrated Design & Media, New York University (2025-2027)

- Bachelor of Design, User Experience Design (2019-2023)

- End-to-end product design: research, ideation, wireframing, testing, implementation, coding proofs of concept using VS Code, GitHub Copilot, Claude Code and similar AI-assisted workflows.
- Practical experience with HTML, CSS, and Javascript, including the ability to build, update and polish web applications, interactive pages, or prototypes using AI-assisted development tools such as Claude Code, Antigravity, Cursor, or similar. Hands-on experience with Figma and Microsoft 365.

- Strong communication and stakeholder management skills; able to present to groups, lead training sessions, create clear instructional content, and influence across levels while balancing structured thinking, experimentation, and rapid iteration.

- Validate assumptions with self-serve research: Talk directly with customers, run quick tests, and use what you learn to adjust direction.
- User research, user studies, usability testing, cross-industry benchmarking

## Projects

### 1. Build an internal Digital Asset Management platform for P&G
Summary: In 2025, as a Lead Experience Designer at Infosys Wongdoody, I built an internal Brand Portal for Procter & Gamble(P&G), a scalable Digital Asset Management (DAM) platform that centralizes creative assets, brand voice, and guidelines across their 65+ global brands (including Oral-B and Ariel), enabling brand managers and creative leaders to work from standardized, up-to-date brand systems.
Problem: P&G's competitors (Nestle, Mondelez, Pepsico, Budweiser) rely on external DAM tools; P&G needed an internal alternative that enforced brand consistency across teams, regions & partners while reduce cost.
Role: Lead Experience Designer — designed a brand portal for digital asset management with scalable floating navigation system and comprehensive sidebar for easier navigation, after testing sidebars, accordions and category-based carousels.
Tools/stack: UI/UX Design, Design systems, Figma
Outcome: Delivered internal DAM portal of 50+ components for 65+ brands, cutting DAM reliance by 30%.

### 2. Transaction recap for HDFC Bank's mobile banking app
Summary: In early 2024, I led the design of a monthly financial recap for HDFC Bank's mobile app, serving 32M+ users. I translated complex data across transactions, investments, loans, and deposits into a single, story-driven experience using structured epics, prioritized use cases, and bank's design system. The prototype was appreciated by the VP, Head of Design, and CDO.
Problem: HDFC's 32M+ users couldn't make sense of their raw transaction data. 
Role: UI/UX Designer — ran usability testing across 3 banking apps, designed a zero-to-one Financial Recap feature turning raw transactions into a story-driven interface generating monthly and yearly reports.
Tools/stack: Banking, User study, Visual design, Prototyping
Outcome: Story-driven monthly recap shipped to HDFC's full mobile banking user base.

### 3. Sand simulation game (Figma + vibe-coded)
Summary: A game that lets you build a world with sand, water, palm trees and brick walls with various pixel sizes.
Role: Designed and vibe-coded a React falling-sand automaton with 10 materials and emergent physics, built with Claude, Figma and Antigravity.
Tools/stack: Vibe-coding, Claude Code, Game Mechanics
Note: this project is a playable demo rather than a written case study.

### 4. Redesigning the Integrated Eligibility System (IES) for enhanced status view
Summary: In late 2024, I led the redesign of the Integrated Eligibility System (IES) at Infosys Public Services (through Wongdoody), a government platform used by caseworkers to assess SNAP and medical aid eligibility. I redesigned critical workflows and Household Individual Tabs to reduce cognitive load, improve status clarity, and enable faster, more accurate case processing. 
Problem: IES is a government-facing platform used to assess and verify citizens' eligibility for public assistance programs (e.g. SNAP). Due to the complexity of multi-member applications, the portal was extensive and prone to misinterpretation, increasing cognitive load and slowing case processing.
Role: Lead Experience Designer — redesigned critical workflows; without direct caseworker access, worked from secondary research and structural prototyping, testing four distinct approaches to member navigation and integrated case information in Figma.
Tools/stack: Public Sector, Redesign, Salesforce Design System
Outcome: Redesigned 150+ screens across 9+ workflows in a federal eligibility system, lifting task 
completion 42%. Feedback from Infosys Public Services credited the prototypes with reducing rework and clarifying page hierarchy for an MVP release.
Also onboarded a new client through RFP by presenting a demo of my redesigned version of IES portal.

### 5. Explicit and mutable context for LLM tools with a design metaphor
Summary: A spatial, editable context layer so AI remembers you accurately.
Problem: LLMs treat early-conversation context as fixed — what you say in the first few turns can't easily be corrected, and users have no visibility into what the model actually retained. Cleaning up context doesn't reduce this problem, it concentrates it.
Role: Student Researcher, NYU AI Computing Lab (COPHEE Lab) — designed interaction models and prototypes making AI memory explicit, editable and user-controllable, grounded in research including a UC San Diego study on LLM fixation/sycophancy and a University of Waterloo study on knowledge-graph visualization.
Tools/stack: Human-AI Interaction, Conversational AI, HCI
Full case study: Project5-Modal on the portfolio (LLM memory/context card).

### 6. AI-powered translation tool for post-editors and publishers (Project Udaan)
Summary: After completing my 6th semester as an exchange student in France, I joined the Indian Institute of Technology Bombay (IIT Bombay) to design a web application for Project Udaan, a long-running initiative aimed at building an AI-powered translation platform for converting engineering textbooks and academic materials from English into regional Indian languages. The project involved cross-institutional stakeholders, including Bank of Baroda, All India Council of Technical Education (AICTE), and Pepstudy.
Problem: The team had built a rudimentary desktop app (on a text editor called QPad) with an AI machine-translation engine. Post-editors — often over 40, with lower vision and mixed digital literacy — struggled with small font sizes, repetitive diagram/table insertion, no collaboration features, unclear icons, and no way to track completion across a book.
Role: Designed role-based personalization (verifier, corrector, project manager access levels), a speech-to-text workflow, clearer iconography, and progress tracking, based on interviews with post-editors from the All India Council of Technical Education (AICTE).
Tools/stack: EduTech, Web application, User Research
Outcome: Features were approved by the team and clients at IIT Bombay and implemented into the product.

### Side projects
- Multi-faceted Music Retrieval: combining audio, text, and joint embedding into a single recommendation system. Tools: Deep Learning, AI, SBERT / CLAP / OpenL3.
In the elective, Deep Learning for Media, at New York University taught by Prof Magdalena Fuentes, Professor at the Music and Audio Research Lab(MARL) and Integrated Design and Media(IDM), we spent the spring semester of 2026 learning about Deep Learning and Neural Network and finally built a music retrieval system as the final project.
- Sound & haptic integration in HDFC Bank's mobile banking app: building a sound design palette for the app. Tools: Multimodal interactions, UX Design. 
During the redesign journey of the new mobile banking app of HDFC Bank in 2024, as a full-time UI/UX Designer, I conducted a case study on integrating sound and haptics design in the mobile banking app to elevate the user experience and the interactivity for the users. Written up on Medium: https://medium.com/@tswdesigns11/sound-haptic-integration-in-hdfc-banks-new-mobile-banking-app-a1b4aed1e6aa
- Workshop: Storytelling for UX Design with AI — conducted a storytelling workshop attended by 110+ designers from 5+ studios.
Designed and led a storytelling workshop for 110+ designers focused on applying narrative frameworks to product design.
I built a structured approach that translates storytelling models (e.g., 3-act structure, narrative arcs) into practical UX tools- mapping user journeys, information architecture, and feature flows into coherent, engaging narratives. The workshop included live breakdowns of real products (e.g., recap experiences, onboarding flows) and hands-on exercises where designers reframed existing flows into story-driven experiences.
The outcome was a repeatable framework that helped teams move from fragmented screens to cohesive product narratives, improving clarity in user flows and reducing iteration cycles during design reviews.

class Component extends DCLogic {
  state = { copyLabel: 'Copy to clipboard', toggleShiftPx: 0 };
  humanBtnRef = React.createRef();
  componentDidMount() {
    if (this.humanBtnRef.current) this.setState({ toggleShiftPx: this.humanBtnRef.current.offsetWidth });
  }
  onHumanNavClick = () => { window.location.href = './index.html'; };
  onCopy = () => {
    const done = () => {
      this.setState({ copyLabel: 'Copied' });
      setTimeout(() => this.setState({ copyLabel: 'Copy to clipboard' }), 1600);
    };
    const fallback = () => {
      const ta = document.createElement('textarea');
      ta.value = MARKDOWN;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      try { document.execCommand('copy'); done(); }
      catch (err) { this.setState({ copyLabel: 'Copy failed — select & copy manually' }); setTimeout(() => this.setState({ copyLabel: 'Copy to clipboard' }), 2200); }
      document.body.removeChild(ta);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(MARKDOWN).then(done).catch(fallback);
    } else {
      fallback();
    }
  };
  renderVals() {
    return { markdownContent: MARKDOWN, copyLabel: this.state.copyLabel, onCopy: this.onCopy, onHumanNavClick: this.onHumanNavClick, humanBtnRef: this.humanBtnRef, toggleShiftPx: this.state.toggleShiftPx };
  }
}
